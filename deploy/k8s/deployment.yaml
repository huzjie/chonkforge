apiVersion: apps/v1
kind: Deployment
metadata:
  name: chonkforge
  labels:
    app: chonkforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chonkforge
  template:
    metadata:
      labels:
        app: chonkforge
    spec:
      containers:
        - name: chonkforge
          image: chonkforge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: CHONK_BACKEND
              value: "mock"
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1"
